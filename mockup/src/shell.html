<title>Lineage Control Tower</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed 1600 x 1000 Tableau canvas (product style). 232px left nav, header band, filter band, card grid.
   Single light theme on purpose: Tableau Public renders light only, so the mockup previews the real build. */
:root {
  color-scheme: light;
  /* Verata brand */
  --navy: #002C55; --blue: #005FAE; --sky: #83C7EB; --lime: #C7FFA4; --offwhite: #F5F5F3;
  /* neutrals, biased toward navy */
  --page: #E6E7E4; --canvas: #F5F5F3; --card: #FFFFFF; --line: #E6E7E2; --line-soft: #EFEFEB; --hover: #F7F8F6;
  --ink: #16212E; --ink-2: #4A5563; --ink-3: #7A838E; --ink-4: #A5ACB4;
  --accent: #005FAE; --accent-tint: #E9F1F9; --accent-mid: #A9C8E6;
  /* status (semantic, never reused for categories) */
  --good: #2F9E6B; --good-ink: #1E7450; --good-tint: #EAF6EF;
  --warn: #E8A33D; --warn-ink: #93600F; --warn-tint: #FDF3E1;
  --crit: #D2453F; --crit-ink: #A92E29; --crit-tint: #FBEAE9;
  --none: #A3ADB8; --none-tint: #F1F2F4;
  /* platforms (validated: lightness band, chroma, CVD all pass) */
  --p-snowflake: #005FAE; --p-databricks: #4BAEE3; --p-redshift: #5B5FC7;
  /* type */
  --f-ui: "Libre Franklin", "Tableau Book", Arial, Helvetica, sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--page); }
body { margin: 0; font-family: var(--f-ui); color: var(--ink); font-size: 12px; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.narrow-note { display: none; max-width: 1600px; margin: 0 auto 10px; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
@media (max-width: 900px) { .narrow-note { display: block; } }
#stage-wrap { max-width: 1600px; margin: 0 auto; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,30,60,.06), 0 8px 28px rgba(0,30,60,.08); }
#stage { width: 1600px; height: 1000px; transform-origin: 0 0; display: grid; grid-template-columns: 232px 1fr; background: var(--canvas); position: absolute; top: 0; left: 0; }
button, select, input { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--f-code); font-size: .92em; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- nav ---------- */
nav { background: var(--card); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 18px; gap: 4px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px 18px; border-bottom: 1px solid var(--line-soft); margin-bottom: 10px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--navy); display: grid; place-items: center; flex: none; }
.brand-name { font-weight: 700; font-size: 14px; color: var(--navy); line-height: 1.15; letter-spacing: -.01em; }
.brand-sub { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.nav-group { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; padding: 12px 10px 6px; }
.nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; border: 0; background: none; width: 100%; text-align: left; color: var(--ink-2); font-weight: 500; font-size: 12.5px; }
.nav-item svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--hover); color: var(--ink); }
.nav-item.active { background: var(--lime); color: var(--navy); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 10px; font-weight: 600; border-radius: 10px; padding: 1px 6px; }
.nav-item .count.crit { background: var(--crit-tint); color: var(--crit-ink); }
.nav-item .count.warn { background: var(--warn-tint); color: var(--warn-ink); }
.nav-foot { margin-top: auto; border-top: 1px solid var(--line-soft); padding: 14px 8px 0; font-size: 10.5px; color: var(--ink-3); line-height: 1.55; }
.nav-foot b { color: var(--ink-2); font-weight: 600; }
.synthetic { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 3px 8px; border-radius: 20px; background: var(--offwhite); border: 1px solid var(--line); color: var(--ink-2); font-size: 10px; }

/* ---------- main ---------- */
main { display: grid; grid-template-rows: 70px 52px minmax(0, 1fr); min-width: 0; min-height: 0; height: 1000px; }
.header { background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 16px; }
.crumb { font-size: 10.5px; color: var(--ink-3); letter-spacing: .02em; }
.crumb b { color: var(--ink-2); font-weight: 500; }
h1 { margin: 3px 0 0; font-size: 20px; font-weight: 600; color: var(--navy); letter-spacing: -.015em; }
h1 .q { font-weight: 400; color: var(--ink-3); font-size: 14px; margin-left: 10px; letter-spacing: 0; }
.updated { margin-left: auto; text-align: right; font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }
.updated b { color: var(--ink); font-weight: 600; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); }
.icon-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.filters { display: flex; align-items: center; gap: 18px; padding: 0 28px; border-bottom: 1px solid var(--line); background: var(--card); }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl-label { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.seg { display: inline-flex; background: var(--offwhite); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--card); color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(0,30,60,.12); }
.pdot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.sel-chip { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--accent-mid); background: var(--accent-tint); color: var(--navy); border-radius: 20px; padding: 4px 6px 4px 12px; font-size: 11.5px; }
.sel-chip b { font-weight: 600; }
.sel-chip button { border: 0; background: var(--card); border-radius: 12px; width: 20px; height: 20px; display: grid; place-items: center; color: var(--ink-2); }
.hint { font-size: 11px; color: var(--ink-3); font-style: italic; }

.content { padding: 20px 28px 22px; overflow: hidden; min-height: 0; }
.view { display: none; height: 100%; }
.view.on { display: grid; }

/* ---------- cards ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.card-h { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.card-t { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.card-s { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.4; }
.card-h .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.card-body { flex: 1; min-height: 0; position: relative; }
.scroll { overflow: auto; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10.5px; color: var(--ink-2); align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* KPI cards */
.kpis { display: grid; gap: 12px; }
.kpi { padding: 12px 14px 10px; }
.kpi-t { font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi-v { font-size: 24px; font-weight: 600; color: var(--navy); margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 3px; letter-spacing: 0; }
.kpi-c { font-size: 10.5px; margin-top: 5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.kpi-c .up-good, .kpi-c .down-good { color: var(--good-ink); font-weight: 600; }
.kpi-c .up-bad, .kpi-c .down-bad { color: var(--crit-ink); font-weight: 600; }
.kpi-c .flat { color: var(--ink-2); font-weight: 600; }
.kpi svg.spark { display: block; margin-top: 8px; width: 100%; height: 30px; }

/* status pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; padding: 2px 7px 2px 5px; border-radius: 20px; white-space: nowrap; line-height: 1.4; }
.pill svg { width: 11px; height: 11px; }
.pill.good { background: var(--good-tint); color: var(--good-ink); }
.pill.warn { background: var(--warn-tint); color: var(--warn-ink); }
.pill.crit { background: var(--crit-tint); color: var(--crit-ink); }
.pill.none { background: var(--none-tint); color: var(--ink-2); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--offwhite); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tag.ai { background: #EEF0FB; border-color: #D9DCF4; color: #3D41A0; }
.tag.obs { background: var(--warn-tint); border-color: #F3DDB4; color: var(--warn-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.crit { background: var(--crit); } .dot.none { background: var(--none); }

/* tables */
table.t { width: 100%; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 0 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; background: var(--card); z-index: 1; }
table.t td { padding: 6px 8px; border-bottom: 1px dotted var(--line); vertical-align: middle; white-space: nowrap; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--hover); }
table.t tr.sel td { background: var(--accent-tint); }
table.t .r { text-align: right; }
.bar-cell { display: flex; align-items: center; gap: 6px; }
.bar-cell .b { height: 6px; border-radius: 3px; background: var(--accent); }
.bar-cell .bt { height: 6px; border-radius: 3px; background: var(--line-soft); flex: 1; position: relative; overflow: hidden; }
.bar-cell .bt span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }

/* hbar list */
.hbars { display: grid; gap: 7px; }
.hbar { display: grid; grid-template-columns: 1fr 52px; gap: 4px 10px; align-items: center; font-size: 11px; }
.hbar .l { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.hbar .track { grid-column: 1 / -1; height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; }
.hbar .track span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }

/* tooltip */
#tip { position: absolute; pointer-events: none; z-index: 50; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,30,60,.14); padding: 9px 11px; font-size: 11px; min-width: 150px; max-width: 320px; display: none; color: var(--ink); line-height: 1.45; }
#tip .tl { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
#tip .tv { font-weight: 600; color: var(--navy); }
#tip .tr { display: flex; justify-content: space-between; gap: 14px; }
#tip .th { font-weight: 600; margin-bottom: 4px; color: var(--ink); white-space: normal; }

svg text { font-family: var(--f-ui); }
.axis text { fill: var(--ink-3); font-size: 9.5px; }
.axis line, .axis path { stroke: var(--line); }
.grid line { stroke: var(--line-soft); }
.empty { color: var(--ink-3); font-size: 11.5px; padding: 18px 0; text-align: center; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 11px; font-size: 11.5px; font-weight: 500; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn.primary:hover { background: #0A3B6B; }
.btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
select.sel { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 5px 8px; font-size: 11.5px; color: var(--ink); max-width: 320px; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 5px 10px; font-size: 11px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sec-label { font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 12px 0 6px; display: flex; align-items: center; gap: 8px; }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
.callout { border-radius: 8px; padding: 10px 12px; font-size: 11.5px; line-height: 1.5; }
.callout.warn { background: var(--warn-tint); border: 1px solid #F3DDB4; color: #5E3D07; }
.callout.info { background: var(--accent-tint); border: 1px solid var(--accent-mid); color: var(--navy); }
.callout.crit { background: var(--crit-tint); border: 1px solid #F2C9C6; color: #6E1D19; }
</style>
